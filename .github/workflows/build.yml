
name: Gforth Android arm64 Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth automake autoconf libtool make gcc pkg-config libffi-dev libltdl-dev texinfo

      - name: Build APK arm64
        run: |
          set -ex
          if [ -d arch/arm64/android ]; then
            ANDROID_DIR=arch/arm64/android
          else
            ANDROID_DIR=arch/arm/android
          fi
          echo "Using $ANDROID_DIR"
          cd "$ANDROID_DIR"
          chmod +x build.sh genlibs.sh gentoolchain.sh scale-icons.sh 2>/dev/null || true
          ./gentoolchain.sh || echo "gentoolchain fallback"
          ./genlibs.sh arm64 || ./genlibs.sh aarch64 || ./genlibs.sh || true
          export ARCH=arm64
          export ANDROID_ARCH=arm64-v8a
          export TARGET=aarch64-linux-android
          export API=21
          ./build.sh release arm64 || ./build.sh arm64 release || ./build.sh || true
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon -PandroidArch=arm64-v8a -PabiFilter=arm64-v8a || ./gradlew assembleRelease --no-daemon || true
          fi
          ls -R build/outputs/ app/build/outputs/ 2>/dev/null || true

      - name: Collect APKs
        run: |
          mkdir -p dist
          find arch -name "*.apk" -type f -exec cp -v {} dist/ \; || true
          ls -lh dist/

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gforth-arm64-v8a-release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
